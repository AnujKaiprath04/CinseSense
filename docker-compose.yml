version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cinesense-db
    environment:
      POSTGRES_USER: cinesense
      POSTGRES_PASSWORD: cinesense_password
      POSTGRES_DB: cinesense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinesense -d cinesense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinesense-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinesense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cinesense:cinesense_password@postgres:5432/cinesense_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinesense-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
